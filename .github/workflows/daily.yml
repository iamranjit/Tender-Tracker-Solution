# Zero-cost alternative to a VPS: run daily on GitHub Actions.
# Secrets: add SMTP_*, TELEGRAM_* etc. under Settings -> Secrets and variables -> Actions.
# The SQLite database is carried between runs with actions/cache (no dashboard in this mode).
name: daily-gem-digest

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST
  workflow_dispatch:

concurrency: gem-digest

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/tender_tracker.db
          key: gem-db-${{ github.run_id }}
          restore-keys: gem-db-

      - name: Run tracker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m tender_tracker run

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/tender_tracker.db
          key: gem-db-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shortlist-and-logs
          path: |
            data/exports/
            data/logs/
          retention-days: 14
